name: Bug
description: Something does not work as specified.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Follow the issue templates in the spec conventions. Refer to other work by spec ID (e.g. E05.F02.S01).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
  - type: textarea
    id: spec-id
    attributes:
      label: Spec ID
    validations:
      required: true
