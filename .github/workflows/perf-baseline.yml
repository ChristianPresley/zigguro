# Rewrites perf/baselines/<machine>/ from a full bench run on that runner
# class and opens a pull request with the change (E14.F06.S02.T02).
# Review it like code: the diff is what perfgate will hold PRs to.
name: perf-baseline

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Machine class to re-baseline
        type: choice
        options: [ci_linux_x64, ci_windows_x64]
        default: ci_linux_x64

permissions:
  contents: write
  pull-requests: write

jobs:
  baseline:
    runs-on: ${{ inputs.machine == 'ci_windows_x64' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACHINE: ${{ inputs.machine }}
      ZG_MACHINE_CLASS: ${{ inputs.machine }}
      ZG_PLATFORM: headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-toolchain.txt') }}
      - if: runner.os == 'Linux'
        run: .github/scripts/setup-zig.sh --dest ~/zig-toolchain
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-zig.ps1 -Dest "$HOME\zig-toolchain"
      - name: Run the benches
        run: |
          zig build bench -Doptimize=ReleaseFast -Dbench-repeats=5 --summary line
          if [ "$RUNNER_OS" = "Linux" ]; then zig build bench-scenarios -Doptimize=ReleaseFast --summary line; fi
          zig build -Doptimize=ReleaseFast bench-build --summary line
          shopt -s nullglob
          zig-out/bench-bin/perfgate merge --out "$RUNNER_TEMP/merged.json" zig-out/bench-results/all.json zig-out/bench-results/scenarios.json zig-out/bench-results/startup.json
      - name: Write the baselines
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          cp -r "perf/baselines/$MACHINE" "$RUNNER_TEMP/old/" 2> /dev/null || true
          zig-out/bench-bin/perfgate baseline --from "$RUNNER_TEMP/merged.json" --machine "$MACHINE" --out "perf/baselines/$MACHINE"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- perf/baselines && [ -z "$(git ls-files --others --exclude-standard perf/baselines)" ]; then
            echo "Baselines unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="perf-baseline/$MACHINE-$(date -u +%Y-%m-%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add perf/baselines
          git commit -m "chore(perf): update $MACHINE baselines" -m "Regenerated by the perf-baseline workflow (run $GITHUB_RUN_ID) from a full ReleaseFast bench run on the $MACHINE runner class." -m "Spec: E14.F06.S02.T02"
          git push origin "$branch"
          {
            echo "Regenerated \`perf/baselines/$MACHINE\` from a full bench run ([workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo '| suite | result | allocs/op before | allocs/op after |'
            echo '|---|---|---:|---:|'
            for f in perf/baselines/"$MACHINE"/*.json; do
              suite=$(basename "$f" .json)
              old="$RUNNER_TEMP/old/$MACHINE/$suite.json"
              jq -r --arg suite "$suite" --slurpfile old <(cat "$old" 2> /dev/null || echo '{"results":[]}') \
                '.results[] as $r | ($old[0].results | map(select(.name == $r.name))[0].allocs_per_op // "–") as $o | select(($o | tostring) != ($r.allocs_per_op | tostring)) | "| \($suite) | \($r.name) | \($o) | \($r.allocs_per_op) |"' "$f"
            done
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "chore(perf): update $MACHINE baselines [E14.F06.S02.T02]" --body-file "$RUNNER_TEMP/body.md"
