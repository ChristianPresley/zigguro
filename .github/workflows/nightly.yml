# Nightly: long fuzz campaigns (Linux only in Zig 0.16), full benches for
# E14, and a cold-cache self-test of the toolchain setup scripts.
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # The trend step downloads the previous nightly's artifact.
  actions: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-toolchain.txt') }}
      - run: .github/scripts/setup-zig.sh --dest ~/zig-toolchain
      - id: list
        run: echo "targets=$(zig build fuzz-list | jq -c '[.targets[].name]')" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: list
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-toolchain.txt') }}
      - run: .github/scripts/setup-zig.sh --dest ~/zig-toolchain
      - name: restore corpus
        uses: actions/cache@v4
        with:
          path: .zig-cache/f
          key: fuzz-corpus-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.arch }}-${{ matrix.target }}-
      - name: fuzz for 35 minutes
        id: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set +e
          timeout 35m zig build test -Doptimize=ReleaseSafe -Dtest-filter="$TARGET" --fuzz
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: triage
        env:
          TARGET: ${{ matrix.target }}
          CODE: ${{ steps.fuzz.outputs.code }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fuzz-triage.sh "$TARGET" "$CODE"
      - if: steps.fuzz.outputs.code != '0' && steps.fuzz.outputs.code != '124'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ runner.arch }}-${{ strategy.job-index }}
          path: fuzz-crashes
      - if: steps.fuzz.outputs.code != '0' && steps.fuzz.outputs.code != '124'
        run: |
          echo "fuzz target exited with ${{ steps.fuzz.outputs.code }}" >&2
          exit 1

  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-toolchain.txt') }}
      - if: runner.os == 'Linux'
        run: .github/scripts/setup-zig.sh --dest ~/zig-toolchain
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-zig.ps1 -Dest "$HOME\zig-toolchain"
      - id: date
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: zig build bench -Doptimize=ReleaseFast -Dbench-repeats=7 --summary line
      - if: runner.os == 'Linux'
        shell: bash
        env:
          ZG_PLATFORM: headless
          ZG_MACHINE_CLASS: ci_linux_x64
        run: zig build bench-scenarios -Doptimize=ReleaseFast --summary line
      # Trend: compare with the previous successful nightly's results
      # (E14.F06.S02.T02). Informational: nightly never fails on it.
      - name: Trend against the previous nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
          DATE: ${{ steps.date.outputs.date }}
          MACHINE: ${{ runner.os == 'Linux' && 'ci_linux_x64' || 'ci_windows_x64' }}
        run: |
          zig build -Doptimize=ReleaseFast bench-build --summary line
          shopt -s nullglob
          files=(zig-out/bench-results/all.json zig-out/bench-results/scenarios.json zig-out/bench-results/startup.json)
          zig-out/bench-bin/perfgate merge --out zig-out/bench-results/nightly.json "${files[@]}"
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId' || true)
          mkdir -p "$RUNNER_TEMP/prev"
          if [ -n "$prev" ] && gh run download "$prev" --repo "$GITHUB_REPOSITORY" --pattern "bench-nightly-$OS-*" --dir "$RUNNER_TEMP/prev"; then
            old=$(find "$RUNNER_TEMP/prev" -name nightly.json | head -n 1)
          fi
          if [ -n "${old:-}" ]; then
            zig-out/bench-bin/perfgate compare --base "$old" --head zig-out/bench-results/nightly.json \
              --baseline "perf/baselines/$MACHINE" --machine "$MACHINE" \
              --json "zig-out/bench-results/trend-$DATE.json" --markdown "$RUNNER_TEMP/trend.md" || true
            cat "$RUNNER_TEMP/trend.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous nightly results to compare with." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-nightly-${{ matrix.os }}-${{ steps.date.outputs.date }}
          path: zig-out/bench-results

  # Absolute budget checks on the reference laptop, when a self-hosted
  # runner labelled zg-ref-laptop is registered (perf/baselines/README.md).
  # Off by default: set the repository variable ZG_REF_LAPTOP to 'true'.
  bench-ref-laptop:
    if: vars.ZG_REF_LAPTOP == 'true'
    runs-on: [self-hosted, zg-ref-laptop]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        run: |
          zig build bench -Doptimize=ReleaseFast -Dbench-repeats=7 --summary line
          zig build bench-scenarios -Doptimize=ReleaseFast --summary line
          zig build -Doptimize=ReleaseFast bench-build --summary line
          zig-out/bench-bin/perfgate merge --out "$RUNNER_TEMP/ref.json" zig-out/bench-results/all.json zig-out/bench-results/scenarios.json
          zig-out/bench-bin/perfgate compare --base "$RUNNER_TEMP/ref.json" --head "$RUNNER_TEMP/ref.json" \
            --machine ref_laptop_2024 --json "$RUNNER_TEMP/ref-gate.json" --markdown "$RUNNER_TEMP/ref.md" || true
          cat "$RUNNER_TEMP/ref.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue per failed budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '.rows[] | select(.verdict == "budget_fail") | .budget_id' "$RUNNER_TEMP/ref-gate.json" | sort -u | while read -r id; do
            title="[perf] budget failure $id"
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number' | grep -q .; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label E14 --body "The nightly reference-laptop run broke budget \`$id\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          done

  toolchain-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          .github/scripts/setup-zig.sh --dest "$RUNNER_TEMP/zig-cold"
          "$(tail -n 1 "$GITHUB_PATH")/zig" version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .github/scripts/setup-zig.ps1 -Dest "$env:RUNNER_TEMP\zig-cold"
          & (Join-Path (Get-Content $env:GITHUB_PATH | Select-Object -Last 1) "zig.exe") version
