# Perf gate (E14.F06.S02.T02): builds the PR's merge base and head, runs
# their benches and headless scenarios interleaved on the same runner,
# and compares them with perfgate. Blocking verdicts fail the job; the
# table goes to the job summary. perf/baselines/README.md explains the
# verdicts and how to accept a regression (label perf-accepted plus a
# baseline update in the same PR). Only GitHub-maintained actions.
name: perf-gate

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            machine: ci_linux_x64
            scenarios: editing_100k view_switch fuzzy_find_1m idle
          - os: windows-2025
            machine: ci_windows_x64
            scenarios: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ZG_MACHINE_CLASS: ${{ matrix.machine }}
      ZG_PLATFORM: headless
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/zig-toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/zig-toolchain.txt') }}
      - if: runner.os == 'Linux'
        run: .github/scripts/setup-zig.sh --dest ~/zig-toolchain
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-zig.ps1 -Dest "$HOME\zig-toolchain"
      - name: Base worktree
        id: base
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          git worktree add ../base "$base"
      - name: Build head
        run: zig build -Doptimize=ReleaseFast bench-build --summary line
      - name: Build base
        id: build_base
        working-directory: ../base
        run: |
          if zig build -Doptimize=ReleaseFast bench-build --summary line; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The merge base has no bench-build step yet; nothing to compare against."
          fi
      - name: Calibrate
        if: steps.build_base.outputs.ok == 'true'
        run: zig-out/bench-bin/perfgate calibrate --reference perf/baselines/ref_laptop_2024/calibration.json --out "$RUNNER_TEMP/calibration.json"
      - name: Run base and head interleaved
        if: steps.build_base.outputs.ok == 'true'
        env:
          PERF_SCENARIOS: ${{ matrix.scenarios }}
        run: .github/scripts/perf-ab.sh ../base . "$RUNNER_TEMP/perf" 5 3
      - name: Compare
        if: steps.build_base.outputs.ok == 'true'
        env:
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MACHINE: ${{ matrix.machine }}
        run: |
          git diff --name-only "$BASE_SHA" -- perf/baselines > "$RUNNER_TEMP/changed-baselines.txt"
          args=(compare --base "$RUNNER_TEMP/perf/base.json" --head "$RUNNER_TEMP/perf/head.json"
            --baseline "perf/baselines/$MACHINE" --machine "$MACHINE"
            --calibration "$RUNNER_TEMP/calibration.json"
            --changed-baselines "$RUNNER_TEMP/changed-baselines.txt"
            --markdown "$RUNNER_TEMP/perf/summary.md" --json "$RUNNER_TEMP/perf/gate.json"
            --base-ref "${BASE_SHA:0:12}" --head-ref "${HEAD_SHA:0:12}")
          if [ "$ACCEPTED" = "true" ]; then args+=(--accepted); fi
          set +e
          zig-out/bench-bin/perfgate "${args[@]}"
          code=$?
          set -e
          cat "$RUNNER_TEMP/perf/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always() && steps.build_base.outputs.ok == 'true'
        with:
          name: perf-gate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/perf
            ${{ runner.temp }}/calibration.json
            **/*.pftrace
          if-no-files-found: ignore
